name: Build Blender Mobile Engine (ARM64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Setup Ninja Build Tool
      run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

    - name: Build Blender Mobile APK (Native C++ & Vulkan)
      run: |
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug --stacktrace --parallel

    - name: Upload Blender Mobile APK
      uses: actions/upload-artifact@v4
      with:
        name: BlenderMobile-v1.0-Vulkan-ARM64
        path: app/build/outputs/apk/debug/app-debug.apk
