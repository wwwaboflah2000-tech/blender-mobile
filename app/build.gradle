plugins {
    id 'com.android.application'
}

android {
    namespace 'org.blendermobile.engine'
    compileSdk 34

    defaultConfig {
        applicationId "org.blendermobile.engine"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0-dev"

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
